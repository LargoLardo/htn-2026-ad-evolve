<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111111">
  <title>Evolve — Creative evolution lab</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="/" aria-label="Evolve home"><span class="brand-mark">e<span>↗</span></span>evolve<span class="brand-dot">.</span></a>
    <button class="nav-item active" id="nav-lab"><span data-icon="flask"></span> Lab</button>
    <button class="nav-item" id="nav-runs"><span data-icon="layers"></span> Experiments <span id="run-count" class="nav-count">0</span></button>
    <button class="nav-item" id="nav-how"><span data-icon="network"></span> How it works</button>
    <div class="recent-label">RECENT</div>
    <div id="recent-runs" class="recent-runs"></div>
    <div class="sidebar-bottom">
      <button class="nav-item" id="nav-connections"><span data-icon="sliders"></span> Connections <span class="connection-dot"></span></button>
    </div>
  </aside>
  <main>
    <span class="pill" id="mode-badge" hidden><i></i> Demo</span>
    <div class="page">
      <div class="lab-layout">
        <section class="brief-panel panel">
          <div class="panel-heading"><h2>Brief</h2></div>
          <form id="brief-form">
            <div class="field"><label for="product">Product name</label><input id="product" name="product" maxlength="100" required placeholder="e.g. PULSE"></div>
            <div class="field"><label for="description">What makes it different?</label><textarea id="description" name="description" rows="2" maxlength="4000" required placeholder="e.g. A botanical sparkling water with bright citrus, no added sugar."></textarea></div>
            <div class="field"><label for="audience">Who is it for?</label><input id="audience" name="audience" maxlength="500" required placeholder="e.g. Creative professionals looking for an afternoon reset"></div>
            <div class="field"><label for="goal">What should the ad achieve?</label><textarea id="goal" name="goal" rows="2" maxlength="800" required placeholder="e.g. Make an everyday break feel refreshing and desirable."></textarea></div>
            <div class="form-divider"></div>
            <div id="emotion-controls"></div>
            <div class="form-divider"></div>
            <div class="number-grid"><div class="field"><label for="rounds">Rounds</label><input id="rounds" name="rounds" type="number" min="1" max="6" value="3" required></div><div class="field"><label for="population">Per round</label><input id="population" name="population" type="number" min="4" max="16" value="8" required></div><div class="field"><label for="shortlist">Shortlist</label><input id="shortlist" name="shortlist" type="number" min="1" max="8" value="3" required></div></div>
            <details class="advanced"><summary>Advanced <span>+</span></summary><div class="field"><label for="mode">Generation</label><select id="mode" name="mode"><option value="demo">Demo · local illustrations</option value="live" disabled>Live · connect an API key</option></select></div><div class="field"><label for="scorer">Scoring</label><select id="scorer" name="scorer"><option value="proxy">Design heuristic · unvalidated</option value="tribe" disabled>TRIBE · connect a calibrated worker</option></select></div><div class="field"><label for="seed">Seed</label><input id="seed" name="seed" type="number" min="0" max="2147483647" value="42" required></div></details>
            <div id="form-error" role="alert" hidden></div>
            <button class="button primary run-button" id="start-run" type="submit"><span>Start evolution</span></button>
            <p class="form-footnote" id="mode-note"></p>
          </form>
        </section>
        <div class="results-column">
          <section id="empty-state" class="empty-state panel">
            <h2>Run an experiment to get started.</h2>
          </section>
          <section id="run-workspace" hidden>
            <div class="run-banner panel"><div><span class="section-kicker" id="run-label">EXPERIMENT</span><h2 id="run-title"></h2><p id="run-stage" role="status" aria-live="polite"></p></div><button class="button secondary compact" id="cancel-run">Stop run</button><a class="button secondary compact" id="export-run" hidden download><span data-icon="download"></span> Export run</a></div>
            <div class="run-progress"><div id="progress-fill"></div></div>
            <div class="metrics"><div><span>Concepts explored</span><strong id="metric-generated">0</strong></div><div><span>Drafts rendered</span><strong id="metric-rendered">0</strong></div><div><span>Cache reuses</span><strong id="metric-cache">0</strong></div><div><span>Elapsed</span><strong id="metric-time">0s</strong></div></div>
            <div class="score-disclosure" id="score-disclosure"></div>
            <div class="results-toolbar"><div class="result-tabs" role="tablist" aria-label="Experiment views"><button role="tab" aria-selected="true" class="active" data-view="candidates">Creatives</button><button role="tab" aria-selected="false" data-view="lineage">Lineage</button><button role="tab" aria-selected="false" data-view="research">Research</button><button role="tab" aria-selected="false" data-view="log">Run log</button></div><span id="run-state" class="tiny-badge"></span></div>
            <div id="result-content"></div>
          </section>
        </div>
      </div>
      <footer>EVOLVE<span>2026</span></footer>
    </div>
  </main>
  <dialog id="detail-dialog"><div class="dialog-top"><span class="section-kicker">CREATIVE INSPECTOR</span><button class="icon-button close-dialog" aria-label="Close creative inspector">✕</button></div><div id="detail-body"></div></dialog>
  <dialog id="info-dialog"><div class="dialog-top"><span class="section-kicker" id="info-label"></span><button class="icon-button close-dialog" aria-label="Close information">✕</button></div><div id="info-body"></div></dialog>
  <div id="toast" role="status" hidden></div>
</body>
</html>
